name: Deploy PixGPT to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

# The OIDC token is needed so the job can assume the AWS deploy role
# (arn:aws:iam::276699357742:role/pixgpt-gh-deploy) without any stored keys.
permissions:
  id-token: write
  contents: read

# Rapid pushes cancel the in-flight deploy; only the newest build runs.
concurrency:
  group: deploy-pixgpt
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::276699357742:role/pixgpt-gh-deploy
          aws-region: us-east-1

      - name: Find the PixGPT instance
        id: instance
        run: |
          ID=$(aws ec2 describe-instances --region us-east-1 \
            --filters "Name=tag:Name,Values=PixGPT" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Found instance: $ID"
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy on EC2 via SSM
        id: deploy
        run: |
          set +e
          ERR=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --region us-east-1 \
            --comment "Auto-deploy ${{ github.sha }}" \
            --parameters 'commands=["cd /opt/pixgpt && git fetch origin main && git checkout --force FETCH_HEAD && bash scripts/ec2-deploy.sh"]' \
            --query 'Command.CommandId' --output text 2>&1)
          RC=$?
          set -e
          echo "SSM rc=$RC"
          echo "SSM output: $ERR"
          if [ $RC -ne 0 ]; then
            echo "::error::SSM send-command failed ($RC): $ERR"
            exit $RC
          fi
          # Trim any stray whitespace/CR so the value is a clean UUID.
          CMD="$(echo "$ERR" | tr -d '\r\n')"
          echo "command_id=$CMD" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy to finish
        env:
          CMD: ${{ steps.deploy.outputs.command_id }}
          INSTANCE: ${{ steps.instance.outputs.instance_id }}
          SHA: ${{ github.sha }}
        run: |
          # AWS CLI exits 254 while the invocation is still registering; the
          # polling loop must tolerate that instead of dying under `-e`.
          set +e

          # The command ID from the Trigger step occasionally does not
          # propagate through $GITHUB_OUTPUT. Recover it by the unique SHA
          # comment instead, so the Wait step never polls an empty ID.
          if [ -z "$CMD" ] || [ "$CMD" = "None" ]; then
            for j in $(seq 1 6); do
              CMD=$(aws ssm list-commands --region us-east-1 --max-items 40 \
                --query "Commands[?Comment == 'Auto-deploy $SHA'] | sort_by(@, &RequestedDateTime) | reverse(@) | [0].CommandId" \
                --output text 2>/dev/null)
              [ -n "$CMD" ] && [ "$CMD" != "None" ] && break
              sleep 10
            done
            echo "Recovered command ID by comment: $CMD"
          fi
          echo "polling command=$CMD instance=$INSTANCE"

          sleep 10
          LAST=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --region us-east-1 --query 'Status' --output text 2>/dev/null)
            RC=$?
            if [ $RC -ne 0 ] || [ -z "$STATUS" ]; then
              echo "invocation not ready yet (rc=$RC) ($i/60)"
              sleep 10
              continue
            fi
            if [ "$STATUS" != "$LAST" ]; then
              echo "status=$STATUS ($i/60)"
              LAST="$STATUS"
            fi
            case "$STATUS" in
              Success)
                echo "=== deploy succeeded ==="
                aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
                  --region us-east-1 --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                echo "=== deploy $STATUS ==="
                aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
                  --region us-east-1 --query 'StandardErrorContent' --output text
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for deploy. CMD='$CMD' INSTANCE='$INSTANCE' last status='$LAST'"
          exit 1
